<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>حجز موعد · Book a visit</title>
<style>
  /* Public booking page (server/booking.mjs). Same look as the app: one teal accent, 4px corners, rules not boxes. */
  :root {
    --accent: #2e6f73; --accent-ink: #fff; --accent-soft: #e6f0f0;
    --bg: #fff; --bg-2: #f6f7f7; --ink: #1d2324; --ink-2: #4d5859; --ink-3: #848f90;
    --rule: #e3e7e7; --rule-2: #cfd6d6; --bad: #b3261e; --bad-soft: #fbeceb; --ok: #2e7d4f;
    --radius: 4px;
    --font: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #6fb3b7; --accent-ink: #0c1415; --accent-soft: #17292a;
      --bg: #121617; --bg-2: #1a1f20; --ink: #e8eded; --ink-2: #b2bcbd; --ink-3: #7f8a8b;
      --rule: #263031; --rule-2: #34403f; --bad: #f2867f; --bad-soft: #2c1a19; --ok: #7fcf9d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
  main { position: relative; max-width: 560px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
  header.top { display: flex; align-items: center; gap: 12px; padding: 8px 0 16px; border-bottom: 1px solid var(--rule); }
  header.top img { width: 52px; height: 52px; object-fit: contain; border-radius: var(--radius); }
  header.top .name { flex: 1; min-width: 0; }
  header.top h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header.top p { margin: 0; color: var(--ink-2); font-size: 13px; }
  .lang { border: 1px solid var(--rule-2); background: none; color: var(--ink-2); border-radius: var(--radius); padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  h2 { font-size: 15px; font-weight: 600; margin: 22px 0 10px; }
  h2 .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 12px; margin-inline-end: 8px; }
  .hint { color: var(--ink-3); font-size: 13px; margin: -4px 0 10px; }
  .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
  .day { flex: 0 0 auto; scroll-snap-align: start; min-width: 64px; text-align: center; border: 1px solid var(--rule-2); background: var(--bg); color: var(--ink); border-radius: var(--radius); padding: 8px 6px; font: inherit; cursor: pointer; }
  .day small { display: block; color: var(--ink-3); font-size: 12px; }
  .day b { display: block; font-size: 18px; }
  .day:disabled { opacity: .4; cursor: default; }
  .day[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .day[aria-pressed="true"] small { color: var(--accent); }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .slot { border: 1px solid var(--rule-2); background: var(--bg); color: var(--ink); border-radius: var(--radius); padding: 10px 4px; font: inherit; font-variant-numeric: tabular-nums; cursor: pointer; direction: ltr; }
  .slot:disabled { color: var(--ink-3); background: var(--bg-2); border-style: dashed; text-decoration: line-through; cursor: default; }
  .slot[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .empty { color: var(--ink-3); padding: 12px 0; }
  label.f { display: block; margin-bottom: 14px; }
  label.f span { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
  label.f em { font-style: normal; color: var(--ink-3); }
  input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--rule-2); border-radius: var(--radius); padding: 11px 12px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ltr { direction: ltr; text-align: start; }
  [dir="rtl"] .ltr { text-align: right; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* Hidden from people, not moved off-screen: in a right-to-left page an off-screen box makes the page scroll sideways. */
  .trap { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); opacity: 0; pointer-events: none; }
  .bar { position: fixed; inset-inline: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--rule); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar .in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .bar .sum { font-size: 13px; color: var(--ink-2); min-height: 1.2em; }
  .primary { width: 100%; border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; padding: 14px; border-radius: var(--radius); cursor: pointer; }
  .primary:disabled { opacity: .45; cursor: default; }
  .err { color: var(--bad); background: var(--bad-soft); padding: 10px 12px; border-radius: var(--radius); font-size: 14px; margin: 12px 0 0; }
  .note { border-inline-start: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 12px; font-size: 14px; border-radius: 0 var(--radius) var(--radius) 0; margin-top: 16px; }
  .done { text-align: center; padding: 40px 0 0; }
  .done .tick { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 34px; margin: 0 auto 14px; }
  .done h2 { font-size: 20px; margin: 0 0 8px; }
  .done p { color: var(--ink-2); margin: 0 0 6px; }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header class="top">
    <img id="logo" alt="" hidden>
    <div class="name"><h1 id="clinic">…</h1><p id="sub" data-t="subtitle"></p></div>
    <button class="lang" id="lang" type="button">English</button>
  </header>

  <div id="closed" hidden><p class="note" id="closedText"></p></div>
  <div id="loadErr" hidden><p class="err" data-t="loadError"></p></div>

  <form id="form" hidden novalidate>
    <h2><span class="n">1</span><span data-t="pickDay"></span></h2>
    <div class="days" id="days" role="group"></div>
    <h2><span class="n">2</span><span data-t="pickTime"></span></h2>
    <div class="slots" id="slots" role="group"></div>
    <p class="empty" id="noSlots" hidden data-t="noSlots"></p>
    <p class="note" id="noDays" hidden></p>

    <h2><span class="n">3</span><span data-t="details"></span></h2>
    <label class="f"><span data-t="name"></span><input id="name" name="name" autocomplete="name" maxlength="80" required></label>
    <label class="f"><span data-t="phone"></span><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" class="ltr" maxlength="25" required placeholder="01xxxxxxxxx"></label>
    <div class="row2">
      <label class="f"><span><span data-t="petName"></span> <em data-t="optional"></em></span><input id="petName" maxlength="60"></label>
      <label class="f"><span><span data-t="species"></span> <em data-t="optional"></em></span><select id="species"></select></label>
    </div>
    <label class="f"><span data-t="reason"></span><select id="type"></select></label>
    <label class="f"><span><span data-t="notes"></span> <em data-t="optional"></em></span><textarea id="notes" rows="2" maxlength="300"></textarea></label>
    <div class="trap" aria-hidden="true"><label>Website <input id="website" tabindex="-1" autocomplete="off"></label></div>
    <p class="note" id="emergency"></p>
    <p class="err" id="err" hidden role="alert"></p>
  </form>

  <section class="done" id="done" hidden>
    <div class="tick">✓</div>
    <h2 data-t="sentTitle"></h2>
    <p id="sentWhen"></p>
    <p data-t="sentBody"></p>
    <p><button class="lang" type="button" id="again" data-t="again"></button></p>
  </section>
</main>
<div class="bar" id="bar" hidden>
  <div class="in">
    <div class="sum" id="sum"></div>
    <button class="primary" id="send" type="button" disabled data-t="send"></button>
  </div>
</div>
<script>
(() => {
  const T = {
    ar: {
      subtitle: 'احجز موعداً للكشف', pickDay: 'اختر اليوم', pickTime: 'اختر الوقت', details: 'بياناتك',
      noSlots: 'كل المواعيد في هذا اليوم محجوزة. جرّب يوماً آخر.', noDays: 'لا توجد مواعيد متاحة في الأسبوعين القادمين. اتصل بالعيادة', name: 'الاسم', phone: 'رقم الموبايل (واتساب)',
      petName: 'اسم الحيوان', species: 'النوع', optional: '(اختياري)', reason: 'سبب الزيارة', notes: 'ملاحظات',
      send: 'إرسال طلب الحجز', sending: 'جارٍ الإرسال…', pickFirst: 'اختر اليوم والوقت', sentTitle: 'تم إرسال طلبك',
      sentBody: 'ستراجع العيادة الطلب وتؤكد لك الموعد على واتساب أو بالهاتف. الموعد غير مؤكد حتى تتواصل معك العيادة.',
      again: 'حجز موعد آخر', closed: 'الحجز عبر الإنترنت غير متاح الآن. للحجز اتصل بالعيادة',
      emergency: 'للحالات الطارئة لا تحجز هنا، اتصل بالعيادة مباشرة', loadError: 'تعذّر الاتصال. تأكد من الإنترنت وأعد تحميل الصفحة.',
      errors: {
        name: 'اكتب اسمك.', phone: 'اكتب رقم موبايل صحيح.', time: 'اختر اليوم والوقت من المواعيد المتاحة.', taken: 'هذا الوقت حُجز للتو. اختر وقتاً آخر.',
        phone_limit: 'لديك بالفعل طلبات حجز قادمة بهذا الرقم. اتصل بالعيادة لتغييرها.', too_many_tries: 'محاولات كثيرة. حاول بعد قليل.',
        closed: 'الحجز عبر الإنترنت غير متاح الآن.', full: 'العيادة لديها طلبات كثيرة الآن. اتصل بالعيادة للحجز.', other: 'حدث خطأ. حاول مرة أخرى.',
      },
      types: { CHECKUP: 'كشف', VACCINATION: 'تطعيم', FOLLOW_UP: 'متابعة', OTHER: 'أخرى' },
      species_: { '': '—', DOG: 'كلب', CAT: 'قطة', BIRD: 'طائر', RABBIT: 'أرنب', REPTILE: 'زواحف', OTHER: 'أخرى' },
      locale: 'ar-EG-u-nu-latn', today: 'اليوم',
    },
    en: {
      subtitle: 'Book a visit', pickDay: 'Choose a day', pickTime: 'Choose a time', details: 'Your details',
      noSlots: 'Every time on this day is booked. Try another day.', noDays: 'No free times in the next two weeks. Please call the clinic', name: 'Your name', phone: 'Mobile number (WhatsApp)',
      petName: 'Pet’s name', species: 'Species', optional: '(optional)', reason: 'Reason for visit', notes: 'Notes',
      send: 'Send booking request', sending: 'Sending…', pickFirst: 'Choose a day and a time', sentTitle: 'Request sent',
      sentBody: 'The clinic will review it and confirm on WhatsApp or by phone. The time is not confirmed until the clinic contacts you.',
      again: 'Book another visit', closed: 'Online booking is not available right now. To book, call the clinic',
      emergency: 'For an emergency don’t book here, call the clinic', loadError: 'Could not connect. Check the internet and reload the page.',
      errors: {
        name: 'Enter your name.', phone: 'Enter a valid mobile number.', time: 'Choose a day and one of the free times.', taken: 'That time was just taken. Please choose another.',
        phone_limit: 'You already have upcoming requests with this number. Call the clinic to change them.', too_many_tries: 'Too many attempts. Try again a little later.',
        closed: 'Online booking is not available right now.', full: 'The clinic has many requests right now. Please call to book.', other: 'Something went wrong. Please try again.',
      },
      types: { CHECKUP: 'Check-up', VACCINATION: 'Vaccination', FOLLOW_UP: 'Follow-up', OTHER: 'Other' },
      species_: { '': '—', DOG: 'Dog', CAT: 'Cat', BIRD: 'Bird', RABBIT: 'Rabbit', REPTILE: 'Reptile', OTHER: 'Other' },
      locale: 'en-GB', today: 'Today',
    },
  };
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  let lang = params.get('lang') === 'en' ? 'en' : 'ar';
  try { lang = localStorage.getItem('book-lang') || lang; } catch { /* private mode */ }
  let info = null;
  let day = null;
  let time = null;
  let busy = false;
  const L = () => T[lang];
  const dateAt = (d) => new Date(`${d}T12:00:00Z`);

  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    $('lang').textContent = lang === 'ar' ? 'English' : 'العربية';
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = L()[el.dataset.t] ?? ''; });
    if (info) {
      $('clinic').textContent = (lang === 'ar' && info.name_ar) ? info.name_ar : info.name_en;
      document.title = `${L().subtitle} · ${$('clinic').textContent}`;
      const phone = info.phone || info.whatsapp || '';
      const tel = (txt) => phone ? `${txt}: <a class="ltr" href="tel:${phone.replace(/[^\d+]/g, '')}" dir="ltr">${esc(phone)}</a>` : txt + '.';
      $('emergency').innerHTML = tel(L().emergency);
      $('closedText').innerHTML = tel(L().closed);
      fillSelect($('type'), info.types, L().types, $('type').value || 'CHECKUP');
      fillSelect($('species'), ['', ...info.species], L().species_, $('species').value);
      renderDays();
      renderSlots();
      $('noDays').innerHTML = tel(L().noDays);
      $('noDays').hidden = (info.days || []).some((x) => x.slots.some((s) => s.free));
    }
    updateBar();
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function fillSelect(sel, keys, labels, value) {
    sel.innerHTML = '';
    for (const k of keys) {
      const o = document.createElement('option');
      o.value = k; o.textContent = labels[k] ?? k;
      sel.appendChild(o);
    }
    sel.value = value;
  }
  const timeFmt = () => new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Cairo', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const dayInfo = (d) => (info?.days || []).find((x) => x.date === d);
  function renderDays() {
    const box = $('days');
    box.innerHTML = '';
    for (const { date: d, slots } of info.days || []) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'day'; b.dataset.d = d;
      b.setAttribute('aria-pressed', String(d === day));
      b.disabled = !slots.some((x) => x.free);
      const wd = new Intl.DateTimeFormat(L().locale, { weekday: 'short', timeZone: 'UTC' }).format(dateAt(d));
      const mo = new Intl.DateTimeFormat(L().locale, { month: 'short', timeZone: 'UTC' }).format(dateAt(d));
      b.innerHTML = `<small>${esc(wd)}</small><b>${Number(d.slice(8))}</b><small>${esc(mo)}</small>`;
      b.onclick = () => pickDay(d);
      box.appendChild(b);
    }
  }
  function renderSlots() {
    const box = $('slots');
    box.innerHTML = '';
    const list = day ? dayInfo(day)?.slots || [] : [];
    $('noSlots').hidden = !(day && !list.some((x) => x.free));
    for (const s of list) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'slot'; b.textContent = timeFmt().format(new Date(s.at));
      b.disabled = !s.free;
      b.setAttribute('aria-pressed', String(s.at === time));
      b.onclick = () => { time = s.at; renderSlots(); updateBar(); };
      box.appendChild(b);
    }
  }
  function pickDay(d) {
    day = d; time = null;
    renderDays(); renderSlots(); updateBar();
  }
  /** Load the clinic's details and the next two weeks' times (again after "taken", so the page shows what is free now). */
  async function load() {
    const j = await (await fetch('/api/public/booking')).json();
    info = j;
    if (j.logo) { $('logo').src = j.logo; $('logo').hidden = false; }
    if (day && !dayInfo(day)) day = null;
    if (!day) day = (j.days || []).find((x) => x.slots.some((s) => s.free))?.date ?? null;
    if (time && !dayInfo(day)?.slots.some((s) => s.at === time && s.free)) time = null;
    applyLang();
    return j;
  }
  function fmtWhen(at) {
    const d = new Date(at);
    const date = new Intl.DateTimeFormat(L().locale, { timeZone: 'Africa/Cairo', weekday: 'long', day: 'numeric', month: 'long' }).format(d);
    return `${date} · ${timeFmt().format(d)}`;
  }
  function updateBar() {
    $('sum').textContent = time ? fmtWhen(time) : L().pickFirst;
    $('send').textContent = busy ? L().sending : L().send;
    $('send').disabled = busy || !time || $('name').value.trim().length < 2 || $('phone').value.replace(/\D/g, '').length < 8;
  }
  function showErr(code) {
    const e = $('err');
    e.textContent = L().errors[code] || L().errors.other;
    e.hidden = false;
    e.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  async function send() {
    if (busy) return;
    $('err').hidden = true;
    busy = true; updateBar();
    try {
      const r = await fetch('/api/public/book', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: $('name').value, phone: $('phone').value, pet_name: $('petName').value, species: $('species').value,
          type: $('type').value, notes: $('notes').value, at: time, website: $('website').value, lang,
        }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        showErr(j.error);
        if (j.error === 'taken') { time = null; await load().catch(() => {}); }
        return;
      }
      $('sentWhen').textContent = fmtWhen(time);
      $('form').hidden = true; $('bar').hidden = true; $('done').hidden = false;
      scrollTo(0, 0);
    } catch { showErr('other'); }
    finally { busy = false; updateBar(); }
  }
  $('send').onclick = send;
  ['name', 'phone'].forEach((id) => $(id).addEventListener('input', updateBar));
  $('lang').onclick = () => {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('book-lang', lang); } catch { /* private mode */ }
    applyLang();
  };
  $('again').onclick = () => {
    $('done').hidden = true; $('form').hidden = false; $('bar').hidden = false;
    $('notes').value = ''; $('petName').value = '';
    time = null; load().catch(() => {});
  };

  applyLang();
  load().then((j) => {
    if (!j.enabled) { $('closed').hidden = false; return; }
    $('form').hidden = false; $('bar').hidden = false;
  }).catch(() => { $('loadErr').hidden = false; });
})();
</script>
</body>
</html>
