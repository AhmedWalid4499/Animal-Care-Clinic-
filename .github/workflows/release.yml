name: Release

# Every push to main (= every merged PR) builds Windows + macOS and publishes them as a GitHub Release
# v<major>.<minor>.<run number>. Installed apps check the latest release and update themselves
# (electron/updater.cjs). major.minor come from package.json; the patch number is this workflow's run count.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.version.outputs.version }}

  macos:
    needs: version
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - run: ls -la out
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$V" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Animal Care Clinic $V" \
            --generate-notes \
            --latest
