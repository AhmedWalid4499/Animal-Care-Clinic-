name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:win
      - name: Smoke test (app starts and renders the login screen)
        run: .\release\win-unpacked\"Animal Care Clinic.exe" --smoke
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: animal-care-clinic-windows
          path: |
            release/*.exe
          if-no-files-found: error
