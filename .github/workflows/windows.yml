name: Windows build

# Runs on every PR (test build, downloadable as an artifact). On main it is called by release.yml with a
# version number, and its files become part of the GitHub Release the installed apps update from.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to stamp into the build (release builds only)
        type: string
        default: ''

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set release version
        if: inputs.version
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run typecheck
      - run: npm run dist:win
      - name: Smoke test (app starts and renders the login screen)
        run: .\release\win-unpacked\"Animal Care Clinic.exe" --smoke
        shell: pwsh
      - name: Desktop features on Windows (tray icon, login item, device name)
        shell: bash
        run: |
          # Exit code 0 only if the tray icon was created (electron/main.cjs, --smoke-desktop); the GUI exe may print nothing.
          "release/win-unpacked/Animal Care Clinic.exe" --smoke --smoke-desktop > smoke-desktop.log 2>&1 || code=$?
          cat smoke-desktop.log || true
          exit ${code:-0}
      - name: Check the update feed (latest.yml + app-update.yml) was generated
        shell: bash
        run: |
          cat release/latest.yml
          grep -q "url: AnimalCareClinic-Setup-.*\.exe" release/latest.yml
          grep -q "provider: github" "release/win-unpacked/resources/app-update.yml"
      # 32-bit build (electron-builder.ia32.cjs): same app from the same dist/, on Electron 22 so it also runs on
      # Windows 7 / 8 (32- or 64-bit) as well as 32-bit Windows 10/11.
      - run: npm run dist:win32
      - name: Smoke test, 32-bit (app starts and renders the login screen)
        run: .\release-ia32\win-ia32-unpacked\"Animal Care Clinic.exe" --smoke
        shell: pwsh
      - name: 32-bit app still starts on Windows 7 (exe header) and its CSS has Chromium 108 fallbacks
        shell: bash
        run: node scripts/check-legacy.mjs "release-ia32/win-ia32-unpacked/Animal Care Clinic.exe"
      - name: 32-bit update feed is published as ia32.yml (64-bit keeps latest.yml)
        shell: bash
        run: |
          mv release-ia32/latest.yml release-ia32/ia32.yml
          cat release-ia32/ia32.yml
          grep -q "url: AnimalCareClinic-Setup-.*-32bit\.exe" release-ia32/ia32.yml
          grep -q "provider: github" "release-ia32/win-ia32-unpacked/resources/app-update.yml"
      - uses: actions/upload-artifact@v4
        with:
          name: animal-care-clinic-windows
          path: release/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: animal-care-clinic-windows-32bit
          path: release-ia32/*.exe
          if-no-files-found: error
      - name: Upload release files (installer, portable, update feed)
        if: inputs.version
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
      # Its own artifact, so the files stay flat (one folder) when the release job merges them.
      - name: Upload release files, 32-bit (installer, portable, ia32.yml)
        if: inputs.version
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-32bit
          path: |
            release-ia32/*.exe
            release-ia32/*.exe.blockmap
            release-ia32/ia32.yml
          if-no-files-found: error
